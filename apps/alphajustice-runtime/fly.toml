app = "alphajustice-runtime"
primary_region = "iad"

[build]
  dockerfile = "../runtime/Dockerfile"

[env]
  PORT = "8080"
  RUNTIME_WORKSPACE_ROOT = "/workspace"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory = "4096mb"
