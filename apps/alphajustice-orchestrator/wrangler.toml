name = "alphajustice-orchestrator-api"
main = "../orchestrator-worker/src/index.ts"
compatibility_date = "2026-03-22"
account_id = "0e1651bc459f3017e816ba2263e0807a"
workers_dev = true
upload_source_maps = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[vars]
IMPLEMENTATION_ID = "alphajustice"
SITE_ORIGIN = "https://alphajustice-web.founders-0e1.workers.dev"
API_ORIGIN = "https://alphajustice-orchestrator-api.founders-0e1.workers.dev"
OPENAI_MODEL = "gpt-5.2"
OPENAI_SYNTH_MODEL = "gpt-5.2"
OPENAI_EMBEDDING_MODEL = "text-embedding-3-small"
TOOL_STREAM_CLEANUP_MODEL = "@cf/zai-org/glm-4.7-flash"
RUNTIME_AGENT_MODEL = "gpt-5.2-codex"
ORCHESTRATOR_MAX_TURNS = "40"
ORCHESTRATOR_MAX_RUNTIME_TASKS_PER_RUN = "16"
ORCHESTRATOR_MAX_RUN_WALL_CLOCK_SECONDS = "1800"
CHEAP_TOOL_TIMEOUT_SECONDS = "120"
RUNTIME_TOOL_TIMEOUT_SECONDS = "1500"
QUEUE_INGEST_NAME = "alphabook-ingest"
QUEUE_JOBS_NAME = "alphabook-jobs"
R2_BUCKET_NAME = "alphabook"
RUNTIME_R2_BUCKET_NAME = "alphabook"
ADMIN_ALLOWED_EMAIL = "rprendergast1121@gmail.com"
RUNTIME_SERVICE_URL = ""
FLY_RUNTIME_APP_NAME = "alphabook-runtime"
FLY_RUNTIME_APP_URL = "https://alphabook-runtime.fly.dev"
FLY_RUNTIME_IMAGE = "registry.fly.io/alphabook-runtime:briefingquality-20260319c"
FLY_RUNTIME_REGION = "iad"
FLY_RUNTIME_MACHINE_CPU_KIND = "shared"
FLY_RUNTIME_MACHINE_CPUS = "2"
FLY_RUNTIME_MACHINE_MEMORY_MB = "4096"

[[r2_buckets]]
binding = "CORPUS_BUCKET"
bucket_name = "alphabook"
preview_bucket_name = "alphabook-corpus-preview"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "alphabook-ingest"

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "alphabook-jobs"

[ai]
binding = "AI"
