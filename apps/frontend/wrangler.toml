name = "alphabook-web"
main = "src/worker.ts"
compatibility_date = "2026-03-12"
account_id = "0e1651bc459f3017e816ba2263e0807a"
workers_dev = true
routes = [
  { pattern = "alpha-book.org", custom_domain = true },
  { pattern = "www.alpha-book.org", custom_domain = true },
]
upload_source_maps = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
IMPLEMENTATION_ID = "alphabook"
API_ORIGIN = "https://api.alpha-book.org"
SITE_ORIGIN = "https://alpha-book.org"
CONTENT_ORIGIN = "https://books.alpha-book.org"

[[r2_buckets]]
binding = "BOOK_CONTENT_BUCKET"
bucket_name = "alphabook"
preview_bucket_name = "alphabook-corpus-preview"
