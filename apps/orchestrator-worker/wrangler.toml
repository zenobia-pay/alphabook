name = "alphabook-orchestrator-api"
main = "src/index.ts"
compatibility_date = "2026-03-12"
compatibility_flags = ["nodejs_compat"]
account_id = "0e1651bc459f3017e816ba2263e0807a"
workers_dev = true
routes = [{ pattern = "api.alpha-book.org", custom_domain = true }]
upload_source_maps = true

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[vars]
OPENAI_MODEL = "gpt-5.2"
OPENAI_SYNTH_MODEL = "gpt-5.2"
EMBEDDING_PROVIDER = "google"
OPENAI_EMBEDDING_MODEL = "text-embedding-3-small"
GOOGLE_EMBEDDING_MODEL = "gemini-embedding-2-preview"
GOOGLE_EMBEDDING_DIMENSIONS = "1536"
SEMANTIC_BACKEND = "semantic"
TOOL_STREAM_CLEANUP_MODEL = "@cf/zai-org/glm-4.7-flash"
RUNTIME_AGENT_MODEL = "gpt-5.2-codex"
ORCHESTRATOR_MAX_TURNS = "40"
ORCHESTRATOR_MAX_RUNTIME_TASKS_PER_RUN = "16"
ORCHESTRATOR_MAX_RUN_WALL_CLOCK_SECONDS = "1800"
CHEAP_TOOL_TIMEOUT_SECONDS = "120"
RUNTIME_TOOL_TIMEOUT_SECONDS = "1500"
QUEUE_INGEST_NAME = "alphabook-ingest"
QUEUE_JOBS_NAME = "alphabook-jobs"
R2_BUCKET_NAME = "alphabook-corpus-live"
RUNTIME_R2_BUCKET_NAME = "alphabook-corpus-live"
WORKOS_CLIENT_ID = "client_01KKFCFAAYN6TDY9G9W6HHK4GF"
ADMIN_ALLOWED_EMAIL = "rprendergast1121@gmail.com"
RUNTIME_SERVICE_URL = ""
FLY_RUNTIME_APP_NAME = "alphabook-runtime"
FLY_RUNTIME_APP_URL = "https://alphabook-runtime.fly.dev"
FLY_RUNTIME_IMAGE = "registry.fly.io/alphabook-runtime:deployment-01KMQWAKJ38FAEV76MGK6KBFXV"
FLY_RUNTIME_REGION = "iad"
FLY_RUNTIME_MACHINE_CPU_KIND = "shared"
FLY_RUNTIME_MACHINE_CPUS = "2"
FLY_RUNTIME_MACHINE_MEMORY_MB = "4096"

[[r2_buckets]]
binding = "CORPUS_BUCKET"
bucket_name = "alphabook-corpus-live"
preview_bucket_name = "alphabook-corpus-live-preview"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "alphabook-ingest"

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "alphabook-jobs"

# Cloudflare-native storage bindings.
[[d1_databases]]
binding = "APP_DB"
database_name = "alphabook-app"
database_id = "3d6ba6c9-25bf-4473-a1e8-1ee10e9174f1"

[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "alphabook-semantic"

[ai]
binding = "AI"
