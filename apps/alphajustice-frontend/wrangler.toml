name = "alphajustice-web"
main = "../frontend/src/worker.ts"
compatibility_date = "2026-03-22"
account_id = "0e1651bc459f3017e816ba2263e0807a"
workers_dev = true
upload_source_maps = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[vars]
API_ORIGIN = "https://alphajustice-orchestrator-api.founders-0e1.workers.dev"
SITE_ORIGIN = "https://alphajustice-web.founders-0e1.workers.dev"
CONTENT_ORIGIN = "https://cases.alphajustice.org"

[[r2_buckets]]
binding = "BOOK_CONTENT_BUCKET"
bucket_name = "alphabook"
preview_bucket_name = "alphabook-corpus-preview"
