services:
  alphabook-runtime:
    build:
      context: ../../../..
      dockerfile: apps/runtime/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      RUNTIME_SHARED_TOKEN: ${RUNTIME_SERVICE_TOKEN}
    ports:
      - "8080:8080"

  alphabook-worker:
    build:
      context: ../../../..
      dockerfile: apps/orchestrator-worker/Dockerfile.linux
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNTIME_SERVICE_URL: http://alphabook-runtime:8080
    command: ["npm", "run", "worker:linux", "-w", "@alphabook/orchestrator-worker"]
    depends_on:
      - alphabook-runtime
